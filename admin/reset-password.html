<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Admin Password | MHS</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/portal.css">
</head>
<body class="login-page">
  <div class="login-card">
    <img src="../assets/images/logo.svg" alt="Mokhleshpur High School crest">
    <h1>Set New Password</h1>
    <p>মোখলেশপুর উচ্চ বিদ্যালয় — Administration Portal</p>
    <form id="reset-form">
      <label>New Password<input id="new-password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></label>
      <label>Confirm Password<input id="confirm-password" type="password" minlength="8" required autocomplete="new-password" placeholder="Confirm new password"></label>
      <button id="save-password" type="submit">Update Password</button>
      <small id="msg" role="status" aria-live="polite"></small>
    </form>
    <a href="login.html">← Back to Admin Login</a>
  </div>
  <script src="../js/core.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
