<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>GALLERY</span><h1>Achievements & Gallery</h1><p>School achievements and photographs.</p></div><section class="section"><div id="ach" class="achievement-list"></div><div id="gallery" class="public-gallery"></div></section></main><script src="js/supabase.js"></script><script>
(async function(){
 const ach=document.getElementById('ach'),gallery=document.getElementById('gallery');
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 try{
  const sb=await window.mhsSupabaseReady;
  const [{data:achievements,error:aError},{data:images,error:gError}]=await Promise.all([
   sb.from('achievements').select('id,title,description,achievement_date,category,image_url').eq('is_published',true).order('display_order').order('achievement_date',{ascending:false}),
   sb.from('gallery').select('id,title,description,image_url,category').eq('is_published',true).neq('category','hero').order('display_order').order('created_at',{ascending:false})
  ]);
  if(aError)throw aError;if(gError)throw gError;
  ach.innerHTML=(achievements||[]).map(x=>`<article class="notice-row"><div><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p><small>${esc(x.achievement_date||x.category||'')}</small>${x.image_url?`<p><img src="${esc(x.image_url)}" alt="${esc(x.title)}" loading="lazy" style="max-width:100%;height:auto;border-radius:8px"></p>`:''}</div></article>`).join('')||'<div class="empty">No achievements have been published yet.</div>';
  gallery.innerHTML=(images||[]).map(x=>`<figure><img src="${esc(x.image_url)}" alt="${esc(x.title||'School gallery image')}" loading="lazy"><figcaption>${esc(x.title||x.description||x.category)}</figcaption></figure>`).join('')||'<div class="empty">No gallery photos have been published yet.</div>';
 }catch(error){console.error('Gallery load failed:',error);ach.innerHTML='<div class="empty">Could not load achievements. Please refresh later.</div>';gallery.innerHTML='<div class="empty">Could not load gallery photos. Please refresh later.</div>';}
})();
</script><script src="js/core.js"></script><script src="js/footer.js"></script></body></html>
