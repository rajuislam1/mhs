<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery | Mokhleshpur High School</title>
  <link rel="icon" href="assets/images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/header.js"></script>
<main class="page">
  <div class="page-hero"><span>GALLERY</span><h1>Achievements & Gallery</h1><p>School achievements, events and photographs.</p></div>
  <section class="section">
    <div class="gallery-achievements">
      <h2>School Achievements</h2>
      <div id="ach" class="achievement-list"><p class="hint">Loading achievements…</p></div>
    </div>
    <div class="gallery-photos-section">
      <h2>School Gallery</h2>
      <div id="gallery" class="public-gallery gallery-page-grid"><p class="hint">Loading school photographs…</p></div>
    </div>
  </section>
</main>
<script src="js/supabase.js"></script>
<script>
(async()=>{
  const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const isTeacherPortrait=x=>/head(?:%20|[\s_-])*teacher|teacher.*(profile|portrait)|emran ali/i.test([x?.title,x?.image_url].join(' '));
  const ach=document.getElementById('ach'),gal=document.getElementById('gallery');
  const localImages=[
    {title:'Entertainment',image_url:'assets/images/Entertainment.jpeg'},
    {title:'Nobin Boron',image_url:'assets/images/Nobin boron.jpeg'},
    {title:'Nobin Boron',image_url:'assets/images/Nobinboron.jpeg'},
    {title:'Kabaddi',image_url:'assets/images/kabadi.jpeg'},
    {title:'School Event',image_url:'assets/images/hero/1.jpg'},
    {title:'School Event',image_url:'assets/images/hero/2.jpg'}
  ];
  try{
    const sb=await window.mhsSupabaseReady;
    const [ar,gr,cr]=await Promise.all([
      sb.from('achievements').select('title,description,achievement_date,category').eq('is_published',true).order('display_order'),
      sb.from('gallery').select('title,description,image_url,category').eq('is_published',true).order('display_order'),
      sb.from('school_public_content').select('*').eq('content_type','achievement').eq('is_published',true).order('display_order').order('event_date')
    ]);
    if(ar.error)throw ar.error;if(gr.error)throw gr.error;if(cr.error)throw cr.error;
    const achievementRows=[
      ...(ar.data||[]).map(x=>({title:x.title,description:x.description,date:x.achievement_date||x.category||''})),
      ...(cr.data||[]).map(x=>({title:x.title,title_bn:x.title_bn,description:x.description||x.description_bn,date:x.event_date||''}))
    ];
    ach.innerHTML=achievementRows.map(x=>'<article class="notice-row"><div><h3>'+E(x.title)+'</h3>'+(x.title_bn?'<p>'+E(x.title_bn)+'</p>':'')+'<p>'+E(x.description||'')+'</p><small>'+E(x.date||'')+'</small></div></article>').join('')||'<div class="empty">No achievements have been published yet.</div>';
    const remote=(gr.data||[]).filter(x=>x.image_url&&!isTeacherPortrait(x));
    const photos=[...localImages,...remote];
    gal.innerHTML=photos.map(x=>'<figure><img loading="lazy" src="'+E(x.image_url)+'" alt="'+E(x.title||'School gallery')+'"><figcaption>'+E(x.title||x.description||'')+'</figcaption></figure>').join('')||'<div class="empty">No gallery photos have been published yet.</div>';
  }catch(e){
    console.error('Gallery load failed:',e);
    ach.innerHTML='<p class="hint">Achievements could not be loaded right now.</p>';
    gal.innerHTML=localImages.map(x=>'<figure><img loading="lazy" src="'+E(x.image_url)+'" alt="'+E(x.title)+'"><figcaption>'+E(x.title)+'</figcaption></figure>').join('');
  }
})();
</script>
<script src="js/core.js"></script>
<script src="js/footer.js"></script>
</body>
</html>
