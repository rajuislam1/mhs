<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>GALLERY</span><h1>Achievements & Gallery</h1><p>School achievements and photographs.</p></div><section class="section"><div id="ach" class="achievement-list"></div><div id="gallery" class="public-gallery"></div></section></main><script src="js/supabase.js"></script><script>
(async()=>{const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const ach=document.getElementById('ach'),gal=document.getElementById('gallery');try{const sb=await window.mhsSupabaseReady;const [ar,gr]=await Promise.all([sb.from('achievements').select('title,description,achievement_date,category').eq('is_published',true).order('display_order'),sb.from('gallery').select('title,description,image_url,category').eq('is_published',true).order('display_order')]);if(ar.error)throw ar.error;if(gr.error)throw gr.error;ach.innerHTML=(ar.data||[]).map(x=>'<article class="notice-row"><div><h3>'+E(x.title)+'</h3><p>'+E(x.description||'')+'</p><small>'+E(x.achievement_date||x.category||'')+'</small></div></article>').join('');gal.innerHTML=(gr.data||[]).map(x=>'<figure><img loading="lazy" src="'+E(x.image_url)+'" alt="'+E(x.title||'School gallery')+'"><figcaption>'+E(x.title||x.description||'')+'</figcaption></figure>').join('')||'<div class="empty">No gallery photos have been published yet.</div>'}catch(e){console.error('Gallery load failed:',e);ach.innerHTML='<p class="hint">Achievements could not be loaded right now.</p>';gal.innerHTML='<div class="empty">Gallery is temporarily unavailable.</div>'}})();
</script><script src="js/core.js"></script><script src="js/footer.js"></script></body></html>
