<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>GALLERY</span><h1>Achievements & Gallery</h1><p>School achievements and photographs.</p></div><section class="section"><div id="ach" class="achievement-list"></div><div id="gallery" class="public-gallery"></div></section></main><script src="js/data.js"></script><script>const a=JSON.parse(localStorage.getItem('mhs_achievements')||'[]'),g=JSON.parse(localStorage.getItem('mhs_gallery')||'[]');document.getElementById('ach').innerHTML=a.map(x=>`<article class="notice-row"><div><h3>${x.title}</h3><p>${x.description||''}</p><small>${x.year||''}</small></div></article>`).join('');document.getElementById('gallery').innerHTML=g.map(x=>`<figure><img src="${x.url}" alt=""><figcaption>${x.caption||''}</figcaption></figure>`).join('')||'<div class="empty">No gallery photos have been published yet.</div>';</script><script src="js/core.js"></script><script src="js/footer.js"></script></body></html>
