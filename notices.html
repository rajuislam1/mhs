<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notices | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span data-i18n="NOTICE BOARD">NOTICE BOARD</span><h1 data-i18n="Latest Notices">Latest Notices</h1><p data-i18n="School announcements and official information.">School announcements and official information.</p></div><section class="section"><div id="allNotices" class="notice-list"></div></section></main><script src="js/data.js"></script><script>const n=JSON.parse(localStorage.getItem('mhs_notices')||'null')||NOTICES;document.getElementById('allNotices').innerHTML=n.map(x=>`<article class="notice-row"><div class="date-box"><b>${new Date(x.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</b><small>${new Date(x.date).getFullYear()}</small></div><div><h3>${x.title}</h3><p>${x.description}</p><small>Posted: ${new Date(x.date).toLocaleString()}</small>${x.file?`<p><a class="text-link" href="${x.file}" target="_blank">View attachment →</a></p>`:''}</div></article>`).join('')||'<div class="empty">No notices published.</div>';</script><script src="js/footer.js"></script></body></html>
