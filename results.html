<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>RESULTS</span><h1>Student Results</h1><p>Search school-published results by class, roll and year.</p></div><section class="section"><div class="result-box"><div class="form-grid"><label>Class<input id="class" inputmode="numeric" placeholder="e.g. 10"></label><label>Roll<input id="roll" inputmode="numeric" placeholder="e.g. 101"></label><label>Year<input id="year" inputmode="numeric" placeholder="e.g. 2026"></label><label>Exam<select id="exam"><option>Half Yearly</option><option value="Final">Final</option><option value="Test">Test</option><option>Lab Test</option></select></label></div><button class="btn green" id="search">Search Result</button><div id="result" aria-live="polite"></div></div><div class="external-result"><h2>SSC Board Results</h2><p>For SSC results, visit the official eBoard Results service.</p><a class="btn outline-green" href="https://eboardresults.com/" target="_blank" rel="noopener">Open eBoard Results ↗</a></div></section></main><script src="js/core.js"></script><script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
document.getElementById('search').addEventListener('click',async()=>{const cls=document.getElementById('class').value.trim(),roll=document.getElementById('roll').value.trim(),year=document.getElementById('year').value.trim(),exam=document.getElementById('exam').value,button=document.getElementById('search'),out=document.getElementById('result');if(!cls||!roll||!year){out.innerHTML='<div class="empty">Enter Class, Roll and Year.</div>';return;}button.disabled=true;out.textContent='Searching published results…';try{const p=new URLSearchParams({class:cls,roll,year,exam});const response=await fetch('/api/public-result?'+p.toString(),{headers:{Accept:'application/json'}});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Could not load result.');const r=payload.result;out.innerHTML='<div class="result-card"><h3>'+E(r.name)+'</h3><p>Class '+E(r.class)+' · Roll '+E(r.roll)+' · '+E(r.year)+' · '+E(r.exam)+'</p><table><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>'+r.subjects.map(x=>'<tr><td>'+E(x.subject)+'</td><td>'+E(x.marks)+'</td><td>'+E(x.grade)+'</td></tr>').join('')+'</table><div class="result-summary"><span><b>Total Marks</b>'+E(r.total)+'</span><span><b>Average</b>'+Number(r.average).toFixed(2)+'</span><span><b>GPA</b>'+Number(r.gpa).toFixed(2)+'</span></div><p><button class="btn green" id="printResult">Print Marksheet</button></p></div>';document.getElementById('printResult').onclick=()=>window.print();}catch(e){out.innerHTML='<div class="empty">'+E(e.message)+'</div>';}finally{button.disabled=false;}});
</script><script src="js/footer.js"></script></body></html>
