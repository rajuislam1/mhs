<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>RESULTS</span><h1 data-i18n="Student Results">Student Results</h1><p data-i18n="Search school-published results by class, roll and year.">Search school-published results by class, roll and year.</p></div><section class="section"><div class="result-box"><div class="form-grid"><label>Class<input id="class" placeholder="e.g. 10"></label><label>Roll<input id="roll" placeholder="e.g. 101"></label><label>Year<input id="year" placeholder="e.g. 2026"></label><label>Exam<select id="exam"><option>Half Yearly</option><option>Final Exam</option><option>Class Test</option><option>Lab Test</option></select></label></div><button class="btn green" id="search" data-i18n="Search Result">Search Result</button><div id="result"></div></div><div class="external-result"><h2 data-i18n="SSC Board Results">SSC Board Results</h2><p data-i18n="For SSC results, visit the official eBoard Results service.">For SSC results, visit the official eBoard Results service.</p><a class="btn outline-green" href="https://eboardresults.com/" target="_blank" rel="noopener" data-i18n="Open eBoard Results ↗">Open eBoard Results ↗</a></div></section></main><script src="js/core.js"></script><script src="js/data.js"></script><script src="js/result-utils.js"></script><script>
(function(){
 const classEl=document.getElementById('class'),rollEl=document.getElementById('roll'),yearEl=document.getElementById('year'),examEl=document.getElementById('exam'),button=document.getElementById('search'),target=document.getElementById('result');
 const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
 async function search(){
  const classValue=classEl.value.trim(),rollValue=rollEl.value.trim(),yearValue=yearEl.value.trim(),examValue=examEl.value;
  if(!classValue||!rollValue||!yearValue){target.innerHTML='<div class="empty">Enter Class, Roll and Year.</div>';return;}
  button.disabled=true;button.textContent='Searching…';target.innerHTML='<div class="empty">Searching published results…</div>';
  try{
   const query=new URLSearchParams({class:classValue,roll:rollValue,year:yearValue,exam:examValue});
   const response=await fetch('/api/public-result?'+query.toString(),{headers:{Accept:'application/json'},cache:'no-store'});
   const payload=await response.json().catch(()=>null);
   if(!response.ok||!payload?.success)throw new Error(payload?.error||'Result search failed.');
   const x=payload.result;
   if(!x){target.innerHTML='<div class="empty" data-i18n="No result found. Check Class, Roll and Year.">No published result found. Check Class, Roll, Year and Exam.</div>';window.MHS_I18N?.translate();return;}
   window._lr=x;
   target.innerHTML=`<div class="result-card"><h3>${esc(x.name||'Student Result')}</h3><p>Student ID ${esc(x.studentId||'—')} · Class ${esc(x.class)} · Roll ${esc(x.roll)} · ${esc(x.year)} · ${esc(x.exam)}</p><table><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>${(x.subjects||[]).map(s=>`<tr><td>${esc(s.subject)}</td><td>${esc(s.marks)}</td><td>${esc(s.grade)}</td></tr>`).join('')}</table><div class="result-summary"><span><b>Total Marks</b>${esc(x.total)}</span><span><b>Average</b>${Number(x.average||0).toFixed(2)}</span><span><b>GPA</b>${Number(x.gpa||0).toFixed(2)}</span></div><p><button class="btn green" onclick="mhsPrintMarksheet(window._lr)">Print Marksheet</button></p></div>`;
  }catch(error){target.innerHTML='<div class="empty">'+esc(error.message||'Could not search results.')+'</div>';}
  finally{button.disabled=false;button.textContent='Search Result';}
 }
 button.addEventListener('click',search);
 [classEl,rollEl,yearEl].forEach(input=>input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();}}));
})();
</script><script src="js/footer.js"></script></body></html>
