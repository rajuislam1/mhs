<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>RESULTS</span><h1 data-i18n="Student Results">Student Results</h1><p data-i18n="Search school-published results by class, roll and year.">Search school-published results by class, roll and year.</p></div><section class="section"><div class="result-box"><div class="form-grid"><label>Class<input id="class" placeholder="e.g. 10"></label><label>Roll<input id="roll" placeholder="e.g. 101"></label><label>Year<input id="year" placeholder="e.g. 2026"></label><label>Exam<select id="exam"><option>Half Yearly</option><option>Final Exam</option><option>Class Test</option><option>Lab Test</option></select></label></div><button class="btn green" id="search" data-i18n="Search Result">Search Result</button><div id="result"></div></div><div class="external-result"><h2 data-i18n="SSC Board Results">SSC Board Results</h2><p data-i18n="For SSC results, visit the official eBoard Results service.">For SSC results, visit the official eBoard Results service.</p><a class="btn outline-green" href="https://eboardresults.com/" target="_blank" rel="noopener" data-i18n="Open eBoard Results ↗">Open eBoard Results ↗</a></div></section></main><script src="js/core.js"></script><script src="js/data.js"></script><script src="js/result-utils.js"></script><script>const r=JSON.parse(localStorage.getItem('mhs_results')||'null')||RESULTS;const classEl=document.getElementById('class'),roll=document.getElementById('roll'),year=document.getElementById('year');document.getElementById('search').onclick=()=>{let c=classEl.value.trim(),ro=roll.value.trim(),y=year.value.trim(),ex=document.getElementById('exam').value,x=r.find(a=>String(a.class)==c&&String(a.roll)==ro&&String(a.year)==y&&String(a.exam||'')==ex);document.getElementById('result').innerHTML=x?(()=>{window._lr=x;const subs=x.subjects||[],total=Number(x.total||subs.reduce((a,s)=>a+Number(s.marks||0),0)),avg=Number(x.average||(subs.length?total/subs.length:0)),gpa=Number(x.gpa||0);return `<div class="result-card"><h3>${mhsEsc(x.name||'Student Result')}</h3><p>${x.studentId?`Student ID ${mhsEsc(x.studentId)} · `:''}Class ${x.class} · Roll ${x.roll} · ${x.year} · ${mhsEsc(x.exam||"")}</p><table><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>${subs.map(s=>`<tr><td>${mhsEsc(s.subject)}</td><td>${s.marks}</td><td>${mhsEsc(s.grade)}</td></tr>`).join('')}</table><div class="result-summary"><span><b>Total Marks</b>${total}</span><span><b>Average</b>${avg.toFixed(2)}</span><span><b>GPA</b>${gpa.toFixed(2)}</span></div><p><button class="btn green" onclick="mhsPrintMarksheet(window._lr)">Print Marksheet</button></p></div>`})():'<div class="empty" data-i18n="No result found. Check Class, Roll and Year.">No result found. Check Class, Roll and Year.</div>';window.MHS_I18N?.translate()};</script><script src="js/footer.js"></script></body></html>
