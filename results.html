<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>RESULTS</span><h1>Student Results</h1><p>Search school-published results by class, roll and year.</p></div><section class="section"><div class="result-box"><div class="form-grid"><label>Class<input id="class" inputmode="numeric" placeholder="e.g. 10"></label><label>Roll<input id="roll" inputmode="numeric" placeholder="e.g. 101"></label><label>Year<input id="year" inputmode="numeric" placeholder="e.g. 2026"></label><label>Exam<select id="exam"><option>Half Yearly</option><option value="Final">Final</option><option value="Test">Test</option><option>Lab Test</option></select></label></div><button class="btn green" id="search">Search Result</button><div id="result" aria-live="polite"></div></div><div class="external-result"><h2>SSC Board Results</h2><p>For SSC results, visit the official eBoard Results service.</p><a class="btn outline-green" href="https://eboardresults.com/" target="_blank" rel="noopener">Open eBoard Results ↗</a></div></section></main><script src="js/core.js"></script><script>
function printMhsMarksheet(markup){const win=window.open('','_blank','width=900,height=700');if(!win){alert('Please allow pop-ups to print the marksheet.');return;}const logo=new URL('assets/images/logo.svg',window.location.href).href;win.document.open();win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>MHS Marksheet</title><style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font:14px Arial,sans-serif;color:#111;margin:0}.sheet{max-width:780px;margin:auto;border:4px double #075b43;padding:22px}.head{text-align:center;border-bottom:2px solid #075b43;padding-bottom:12px;margin-bottom:16px}.head img{width:88px;height:98px;object-fit:contain;display:block;margin:0 auto 5px}.head h1{margin:3px;font-size:22px;color:#075b43}.head p{margin:2px}.sheet h2{text-align:center;font-size:18px;margin:12px}.sheet table{width:100%;border-collapse:collapse;margin:13px 0}.sheet td,.sheet th{border:1px solid #777;padding:8px;text-align:left}.sheet th{background:#edf4ef}.sign{display:flex;justify-content:space-between;margin:65px 20px 10px}.sign span{border-top:1px solid #333;padding:7px 22px 0}</style></head><body><div class="sheet"><div class="head"><img src="'+logo+'" alt="School logo"><h1>Mokhleshpur High School</h1><p>মোখলেশপুর উচ্চ বিদ্যালয়</p><p>Mokhleshpur, Birol, Dinajpur · EIIN 120140</p></div>'+markup+'</div><script>window.onload=function(){setTimeout(function(){window.print()},400)};<\/script></body></html>');win.document.close();}
function printMhsMarksheet(markup){const win=window.open('','_blank','width=900,height=700');if(!win){alert('Please allow pop-ups to print the marksheet.');return;}const logo=new URL('assets/images/logo.svg',window.location.href).href;win.document.open();win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>MHS Marksheet</title><style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font:14px Arial,sans-serif;color:#111;margin:0}.sheet{max-width:780px;margin:auto;border:4px double #075b43;padding:22px}.head{text-align:center;border-bottom:2px solid #075b43;padding-bottom:12px;margin-bottom:16px}.head img{width:88px;height:98px;object-fit:contain;display:block;margin:0 auto 5px}.head h1{margin:3px;font-size:22px;color:#075b43}.head p{margin:2px}.sheet h2{text-align:center;font-size:18px;margin:12px}.sheet table{width:100%;border-collapse:collapse;margin:13px 0}.sheet td,.sheet th{border:1px solid #777;padding:8px;text-align:left}.sheet th{background:#edf4ef}.sign{display:flex;justify-content:space-between;margin:65px 20px 10px}.sign span{border-top:1px solid #333;padding:7px 22px 0}</style></head><body><div class="sheet"><div class="head"><img src="'+logo+'" alt="School logo"><h1>Mokhleshpur High School</h1><p>মোখলেশপুর উচ্চ বিদ্যালয়</p><p>Mokhleshpur, Birol, Dinajpur · EIIN 120140</p></div>'+markup+'</div><script>window.onload=function(){setTimeout(function(){window.print()},400)};<\/script></body></html>');win.document.close();}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
document.getElementById('search').addEventListener('click',async()=>{const cls=document.getElementById('class').value.trim(),roll=document.getElementById('roll').value.trim(),year=document.getElementById('year').value.trim(),exam=document.getElementById('exam').value,button=document.getElementById('search'),out=document.getElementById('result');if(!cls||!roll||!year){out.innerHTML='<div class="empty">Enter Class, Roll and Year.</div>';return;}button.disabled=true;out.textContent='Searching published results…';try{const p=new URLSearchParams({class:cls,roll,year,exam});const response=await fetch('/api/public-result?'+p.toString(),{headers:{Accept:'application/json'}});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Could not load result.');const r=payload.result;out.innerHTML='<div class="result-card"><h3>'+E(r.name)+'</h3><p>Class '+E(r.class)+' · Roll '+E(r.roll)+' · '+E(r.year)+' · '+E(r.exam)+'</p><table><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>'+r.subjects.map(x=>'<tr><td>'+E(x.subject)+'</td><td>'+E(x.marks)+'</td><td>'+E(x.grade)+'</td></tr>').join('')+'</table><div class="result-summary"><span><b>Total Marks</b>'+E(r.total)+'</span><span><b>Average</b>'+Number(r.average).toFixed(2)+'</span><span><b>GPA</b>'+(r.gpa_pending?'Pending':Number(r.gpa).toFixed(2))+'</span><span><b>Grade</b>'+(r.gpa_pending?'Pending':E(r.overall_grade||'—'))+'</span></div><p><button class="btn green" id="printResult">Print Marksheet</button></p></div>';document.getElementById('printResult').onclick=()=>{const card=out.querySelector('.result-card');const markup=card.innerHTML.replace(/<p><button[\\s\\S]*$/,'')+'<div class="sign"><span>Class Teacher</span><span>Headmaster</span></div>';printMhsMarksheet(markup);};}catch(e){out.innerHTML='<div class="empty">'+E(e.message)+'</div>';}finally{button.disabled=false;}});
</script><script src="js/footer.js"></script></body></html>
