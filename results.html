<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>RESULTS</span><h1 data-i18n="Student Results">Student Results</h1><p data-i18n="Search school-published results by class, roll and year.">Search school-published results by class, roll and year.</p></div><section class="section"><div class="result-box"><div class="form-grid"><label>Class<input id="class" placeholder="e.g. 10"></label><label>Roll<input id="roll" placeholder="e.g. 101"></label><label>Year<input id="year" placeholder="e.g. 2026"></label><label>Exam<select id="exam"><option>Half Yearly</option><option>Final Exam</option><option>Class Test</option><option>Lab Test</option></select></label></div><button class="btn green" id="search" data-i18n="Search Result">Search Result</button><div id="result"></div></div><div class="external-result"><h2 data-i18n="SSC Board Results">SSC Board Results</h2><p data-i18n="For SSC results, visit the official eBoard Results service.">For SSC results, visit the official eBoard Results service.</p><a class="btn outline-green" href="https://eboardresults.com/" target="_blank" rel="noopener" data-i18n="Open eBoard Results ↗">Open eBoard Results ↗</a></div></section></main><script src="js/core.js"></script><script src="js/data.js"></script><script src="js/result-utils.js"></script><script src="js/supabase.js"></script><script>
(async()=>{const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const button=document.getElementById('search'),out=document.getElementById('result');button.onclick=async()=>{const c=document.getElementById('class').value.trim(),ro=document.getElementById('roll').value.trim(),y=document.getElementById('year').value.trim(),ex=document.getElementById('exam').value;if(!c||!ro||!y){out.innerHTML='<div class="empty">Enter Class, Roll and Year.</div>';return}button.disabled=true;out.textContent='Searching published results…';try{const sb=await window.mhsSupabaseReady;const {data:cl,error:ce}=await sb.from('classes').select('id').eq('class_number',Number(c)).maybeSingle();if(ce)throw ce;if(!cl)throw new Error('Class not found.');const {data:yr,error:ye}=await sb.from('academic_years').select('id').eq('year',Number(y)).maybeSingle();if(ye)throw ye;if(!yr)throw new Error('Academic year not found.');const {data:st,error:se}=await sb.from('students').select('id,name,student_id,roll,class_id,academic_year_id,section').eq('roll',Number(ro)).eq('class_id',cl.id).eq('academic_year_id',yr.id).maybeSingle();if(se)throw se;if(!st)throw new Error('No student found for this Class, Roll and Year.');const {data:rows,error:re}=await sb.from('results').select('id,marks,grade,grade_point,exam_name,status,class_subjects(subject_id,subjects(name))').eq('student_id',st.id).eq('academic_year_id',yr.id).eq('status','published').eq('exam_name',ex);if(re)throw re;if(!rows?.length)throw new Error('No published result found for this student and exam.');const subs=rows.map(x=>({subject:x.class_subjects?.subjects?.name||'Subject',marks:Number(x.marks||0),grade:x.grade||'',point:Number(x.grade_point||0)}));const total=subs.reduce((a,x)=>a+x.marks,0),avg=total/subs.length,gpa=subs.reduce((a,x)=>a+x.point,0)/subs.length;window._mhsPublishedResult={name:st.name,class:c,roll:ro,year:y,exam:ex,subjects:subs,total,average:avg,gpa};out.innerHTML='<div class="result-card"><h3>'+E(st.name)+'</h3><p>Class '+E(c)+' · Roll '+E(ro)+' · '+E(y)+' · '+E(ex)+'</p><table><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>'+subs.map(x=>'<tr><td>'+E(x.subject)+'</td><td>'+E(x.marks)+'</td><td>'+E(x.grade)+'</td></tr>').join('')+'</table><div class="result-summary"><span><b>Total Marks</b>'+total+'</span><span><b>Average</b>'+avg.toFixed(2)+'</span><span><b>GPA</b>'+gpa.toFixed(2)+'</span></div><p><button class="btn green" id="printMhsResult">Print Marksheet</button></p></div>';document.getElementById('printMhsResult').onclick=()=>window.print()}catch(e){console.error('Published result query failed:',e);out.innerHTML='<div class="empty">'+E(e.message||'Could not load result.')+'</div>'}finally{button.disabled=false}}})();
</script><script src="js/footer.js"></script></body></html>
