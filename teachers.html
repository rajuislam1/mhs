<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teachers & Staff | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head>
<body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span data-en="OUR SCHOOL TEAM" data-bn="আমাদের বিদ্যালয় পরিবার">OUR SCHOOL TEAM</span><h1 data-en="Teachers & Staff" data-bn="শিক্ষক ও কর্মচারী">Teachers & Staff</h1><p data-en="Meet the people who support our students." data-bn="আমাদের শিক্ষার্থীদের পাশে থাকা শিক্ষক ও কর্মচারীদের পরিচিতি।">Meet the people who support our students.</p></div>
<section class="section"><div class="staff-filters"><button data-filter="all" class="active" data-en="All" data-bn="সবাই">All</button><button data-filter="headteacher" data-en="Headteacher" data-bn="প্রধান শিক্ষক">Headteacher</button><button data-filter="teacher" data-en="Teachers" data-bn="শিক্ষক">Teachers</button><button data-filter="assistant" data-en="Assistant Teachers" data-bn="সহকারী শিক্ষক">Assistant Teachers</button><button data-filter="staff" data-en="Employees" data-bn="কর্মচারী">Employees</button></div><div id="teacherGrid" class="teacher-grid"><p class="hint">Loading staff profiles...</p></div></section></main>
<script src="js/data.js"></script><script src="js/supabase.js"></script><script>
(async function(){const grid=document.getElementById('teacherGrid');let list=[];const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function category(x){const d=String(x.designation||'').toLowerCase();if(d.includes('head')||d.includes('প্রধান'))return'headteacher';if(d.includes('assistant')||d.includes('সহকারী'))return'assistant';if(d.includes('staff')||d.includes('employee')||d.includes('কর্মচারী')||d.includes('অফিস'))return'staff';return'teacher'}function render(filter){const data=list.filter(x=>filter==='all'||category(x)===filter);grid.innerHTML=data.map(x=>{const photo=String(x.photo||'').trim(),safe=/^https?:\/\/[^\s"'<>]+$/i.test(photo)?photo:'';return '<article class="teacher-card"><div class="avatar">'+(safe?'<img loading="lazy" src="'+E(safe)+'" alt="'+E(x.name)+'">':'<span>👤</span>')+'</div><h3>'+E(x.name)+'</h3><p>'+E(x.designation||'Teacher')+'</p><b>'+E(x.subject||'')+'</b><small>'+E(x.qualification||'')+'</small></article>'}).join('')||'<p class="hint">No profiles found in this category.</p>';window.MHS_I18N?.translate(grid)}document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.filter)}));try{const sb=await window.mhsSupabaseReady;const {data,error}=await sb.from('teacher_public_profiles').select('id,name,designation,subject,qualification,photo').eq('is_published',true).order('created_at',{ascending:true});if(error)throw error;list=data||[];const wanted=new URLSearchParams(location.search).get('category')||'all';const button=document.querySelector('[data-filter="'+wanted+'"]');(button||document.querySelector('[data-filter="all"]')).click()}catch(e){console.error(e);grid.innerHTML='<p class="hint">Staff profiles are temporarily unavailable.</p>'}})();
</script><script src="js/footer.js"></script></body></html>
