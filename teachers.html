<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teachers | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span data-i18n="OUR TEACHERS">OUR TEACHERS</span><h1 data-i18n="Teachers & Staff">Teachers & Staff</h1><p data-i18n="Dedicated educators supporting our students.">Dedicated educators supporting our students.</p></div><section class="section"><div id="teacherGrid" class="teacher-grid"></div></section></main><script src="js/data.js"></script><script>const t=JSON.parse(localStorage.getItem('mhs_teachers')||'null')||TEACHERS;document.getElementById('teacherGrid').innerHTML=t.map(x=>`<article class="teacher-card"><div class="avatar">${x.photo?`<img src="${x.photo}" alt="">`:'<span>👤</span>'}</div><h3>${x.name}</h3><p>${x.designation}</p><b>${x.subject}</b><small>${x.qualification||'Qualification not provided'}</small></article>`).join('');</script><script src="js/footer.js"></script></body></html>
