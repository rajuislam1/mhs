<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply Online | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>ADMISSION</span><h1>Online Admission Application</h1><p>Submit your application; the school office will contact you.</p></div><section class="section"><div class="result-box"><form id="af"><div class="form-grid"><label>Student Name<input id="n" required></label><label>Date of Birth<input id="d" type="date" required></label><label>Applying for Class<select id="c"><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label>Gender<select id="gn"><option>Male</option><option>Female</option><option>Other</option></select></label><label>Guardian Name<input id="g" required></label><label>Guardian Phone<input id="p" required pattern="01[0-9]{9}" placeholder="01XXXXXXXXX"></label><label>Previous School<input id="v"></label><label>Address<input id="a" required></label></div><button class="btn green">Submit Application</button><div id="ok"></div></form></div></section></main><script src="js/core.js"></script><script>af.onsubmit=e=>{e.preventDefault();const a=mhsGet('mhs_applications',[]);a.push({id:Date.now(),name:n.value.trim(),dob:d.value,class:c.value,gender:gn.value,guardian:g.value.trim(),phone:p.value.trim(),prev:v.value.trim(),address:document.getElementById('a').value.trim(),status:'pending',createdAt:new Date().toISOString()});mhsSet('mhs_applications',a);af.reset();ok.innerHTML='<div class="empty">Application submitted. The school will contact you on the phone number provided.</div>'}</script><script src="js/footer.js"></script></body></html>
