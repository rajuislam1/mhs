<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply Online | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>ADMISSION</span><h1>Online Admission Application</h1><p>Submit your application; the school office will contact you.</p></div><section class="section"><div class="result-box"><form id="af"><div class="form-grid"><label>Student Name<input id="n" required></label><label>Date of Birth<input id="d" type="date" required></label><label>Applying for Class<select id="c"><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label>Gender<select id="gn"><option>Male</option><option>Female</option><option>Other</option></select></label><label>Guardian Name<input id="g" required></label><label>Guardian Phone<input id="p" required pattern="01[0-9]{9}" placeholder="01XXXXXXXXX"></label><label>Previous School<input id="v"></label><label>Address<input id="a" required></label></div><button class="btn green">Submit Application</button><div id="ok"></div></form></div></section></main><script src="js/supabase.js"></script><script>
af.onsubmit=async e=>{e.preventDefault();const btn=af.querySelector('button[type="submit"],button:not([type])');btn?.setAttribute('disabled','disabled');ok.textContent='Submitting application…';try{const sb=await window.mhsSupabaseReady;const className=c.value.trim();const {data:cl,error:ce}=await sb.from('classes').select('id').eq('class_number',Number(className)).maybeSingle();if(ce)throw ce;if(!cl)throw new Error('The selected class is not configured. Please contact the school office.');const appNo='MHS-'+new Date().getFullYear()+'-'+Date.now().toString().slice(-7);const {error}=await sb.from('admission_applications').insert({application_no:appNo,student_name:n.value.trim(),date_of_birth:d.value,applying_class_id:cl.id,gender:gn.value,father_name:g.value.trim(),guardian_mobile:p.value.trim(),previous_school:v.value.trim()||null,address:document.getElementById('a').value.trim(),application_status:'pending'});if(error)throw error;af.reset();ok.innerHTML='<div class="empty">Application submitted successfully. Application No: <b>'+appNo+'</b>. The school will contact you on the phone number provided.</div>'}catch(err){console.error('Admission submission failed:',err);ok.textContent=err.message||'Application could not be submitted. Please try again.'}finally{btn?.removeAttribute('disabled')}};
</script><script src="js/footer.js"></script></body></html>
