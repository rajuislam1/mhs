<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply Online | Mokhleshpur High School</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>ADMISSION</span><h1>Online Admission Application</h1><p>Submit your application; the school office will contact you.</p></div><section class="section"><div class="result-box"><form id="af"><div class="form-grid"><label>Student Name<input id="n" required></label><label>Date of Birth<input id="d" type="date" required></label><label>Applying for Class<select id="c"><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label>Gender<select id="gn"><option>Male</option><option>Female</option><option>Other</option></select></label><label>Guardian Name<input id="g" required></label><label>Guardian Phone<input id="p" required pattern="01[0-9]{9}" placeholder="01XXXXXXXXX"></label><label>Previous School<input id="v"></label><label>Address<input id="a" required></label></div><button class="btn green">Submit Application</button><div id="ok"></div></form></div></section></main><script src="js/supabase.js"></script><script>
document.getElementById('af').addEventListener('submit',async event=>{
 event.preventDefault();
 const form=event.currentTarget,button=form.querySelector('button[type="submit"],button');
 const out=document.getElementById('ok');
 const value=id=>document.getElementById(id).value.trim();
 button.disabled=true;button.textContent='Submitting…';out.textContent='';
 try{
  const sb=await window.mhsSupabaseReady;
  const classNumber=Number(value('c'));
  const {data:classRows,error:classError}=await sb.from('classes').select('id,class_number').eq('class_number',classNumber).eq('status',true).limit(1);
  if(classError)throw classError;
  if(!classRows?.length)throw new Error('This class is not currently configured for online admission. Please contact the school office.');
  const applicationNo='APP-'+new Date().getFullYear()+'-'+crypto.randomUUID().replace(/-/g,'').slice(0,12).toUpperCase();
  const {error}=await sb.from('admission_applications').insert({
   application_no:applicationNo,
   student_name:value('n'),
   date_of_birth:value('d')||null,
   applying_class_id:classRows[0].id,
   gender:value('gn')||null,
   father_name:value('g'),
   guardian_mobile:value('p'),
   mobile:value('p'),
   previous_school:value('v')||null,
   address:value('a'),
   application_status:'pending'
  });
  if(error)throw error;
  form.reset();
  out.innerHTML='<div class="empty">Application submitted successfully. Your application number is <strong>'+applicationNo+'</strong>. Keep it for reference. The school will contact you on the phone number provided.</div>';
 }catch(error){
  console.error('Admission application submit failed:',error);
  out.innerHTML='<div class="empty" role="alert">Could not submit the application: '+String(error.message||'Please try again later.').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))+'</div>';
 }finally{button.disabled=false;button.textContent='Submit Application';}
});
</script><script src="js/footer.js"></script></body></html>
