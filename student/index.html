<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal | MHS</title><style>body{font-family:system-ui;background:#f3f7f5;margin:0;padding:16px;color:#17231d}.w{max-width:920px;margin:auto}.c{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px #0001}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dde6e1;padding:8px;text-align:left}button{padding:9px 14px;background:#0b6b4a;color:#fff;border:0;border-radius:7px;cursor:pointer}button:disabled{opacity:.6}.hint{color:#58665e}@media print{.np{display:none}body{background:#fff}.c{box-shadow:none}}</style></head><body><div class="w"><div class="c np" style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><b>Mokhleshpur High School · Student Portal</b><span><button onclick="window.print()">Print</button> <button id="logout">Logout</button></span></div><div id="profile" class="c">Loading student profile…</div><div class="c"><h3>My Subjects</h3><div id="subjects">Loading…</div></div><div class="c"><h3>Published Results</h3><div id="results">Loading…</div></div><div class="c"><h3>Fee Payments</h3><div id="fees">Loading…</div></div><div id="error" class="c" hidden></div></div><script src="../js/supabase.js"></script><script>
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fail=e=>{console.error(e);const box=document.getElementById('error');box.hidden=false;box.textContent=e.message||'Unable to load student data.';};
document.getElementById('logout').onclick=async()=>{try{const sb=await window.mhsSupabaseReady;await sb.auth.signOut();}finally{location.href='login.html';}};
(async()=>{try{
 const sb=await window.mhsSupabaseReady;const {data:sessionData,error:se}=await sb.auth.getSession();if(se)throw se;if(!sessionData.session){location.href='login.html';return;}
 const user=sessionData.session.user;const {data:p,error:pe}=await sb.from('user_profiles').select('id,role,is_active,student_id,display_name').eq('id',user.id).maybeSingle();if(pe)throw pe;if(!p||p.role!=='student'||!p.is_active||!p.student_id){await sb.auth.signOut();location.href='login.html';return;}
 const {data:st,error:ste}=await sb.from('students').select('id,student_id,admission_number,name,father_name,mother_name,class_id,academic_year_id,roll,section,mobile,address,status,classes(name,class_number),academic_years(year)').eq('id',p.student_id).maybeSingle();if(ste)throw ste;if(!st||!st.status){await sb.auth.signOut();location.href='login.html';return;}
 document.getElementById('profile').innerHTML='<h2>'+E(st.name)+'</h2><p><b>Student ID:</b> '+E(st.student_id)+' · <b>Admission No.:</b> '+E(st.admission_number||'—')+'</p><p><b>Class:</b> '+E(st.classes?.class_number||st.classes?.name||'—')+(st.section?' - '+E(st.section):'')+' · <b>Roll:</b> '+E(st.roll||'—')+' · <b>Academic Year:</b> '+E(st.academic_years?.year||'—')+'</p><p><b>Father:</b> '+E(st.father_name||'—')+' · <b>Mother:</b> '+E(st.mother_name||'—')+'</p>';
 const [{data:sub,error:sue},{data:res,error:re},{data:fees,error:fe}]=await Promise.all([
  sb.from('student_subjects').select('is_optional,class_subjects(subject_id,subjects(name),classes(class_number),academic_years(year))').eq('student_id',st.id),
  sb.from('results').select('id,exam_name,marks,grade,grade_point,status,academic_year_id,class_subjects(subject_id,subjects(name))').eq('student_id',st.id).eq('status','published').order('exam_name'),
  sb.from('student_fees').select('fee_type,amount,paid_amount,payment_status,due_date,paid_at,payment_method,transaction_id').eq('student_id',st.id).order('created_at',{ascending:false})
 ]);
 if(sue)throw sue;if(re)throw re;if(fe)throw fe;
 document.getElementById('subjects').innerHTML=(sub||[]).filter(x=>!x.class_subjects?.academic_years?.year||Number(x.class_subjects.academic_years.year)===Number(st.academic_years?.year)).map(x=>'<div>• '+E(x.class_subjects?.subjects?.name||'Subject')+(x.is_optional?' (Optional)':'')+'</div>').join('')||'<p class="hint">No subjects have been assigned yet.</p>';
 const groups={};(res||[]).forEach(x=>{const k=x.exam_name+'|'+x.academic_year_id;(groups[k] ||= []).push(x);});
 document.getElementById('results').innerHTML=Object.values(groups).map(rows=>{const total=rows.reduce((n,x)=>n+Number(x.marks||0),0),gpa=rows.length?(rows.some(x=>Number(x.grade_point||0)===0)?0:Math.min(5,rows.reduce((n,x)=>n+Number(x.grade_point||0),0)/rows.length)):0;return '<h4>'+E(rows[0].exam_name)+'</h4><table><tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Grade Point</th></tr>'+rows.map(x=>'<tr><td>'+E(x.class_subjects?.subjects?.name||'Subject')+'</td><td>'+E(x.marks??'—')+'</td><td>'+E(x.grade||'—')+'</td><td>'+E(x.grade_point??'—')+'</td></tr>').join('')+'</table><p><b>Total:</b> '+total+' · <b>Average:</b> '+(total/rows.length).toFixed(2)+' · <b>GPA:</b> '+gpa.toFixed(2)+'</p>';}).join('')||'<p class="hint">No result has been published for your account yet.</p>';
 document.getElementById('fees').innerHTML=(fees||[]).length?'<table><tr><th>Fee</th><th>Amount</th><th>Paid</th><th>Status</th><th>Due Date</th><th>Payment</th></tr>'+fees.map(x=>'<tr><td>'+E(x.fee_type)+'</td><td>৳'+E(x.amount)+'</td><td>৳'+E(x.paid_amount)+'</td><td>'+E(x.payment_status)+'</td><td>'+E(x.due_date||'—')+'</td><td>'+E(x.payment_method||'—')+' '+E(x.transaction_id||'')+'</td></tr>').join('')+'</table>':'<p class="hint">No fee records are available.</p>';
 }catch(e){fail(e);}})();
</script></body></html>
