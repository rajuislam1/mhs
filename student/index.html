<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Portal | MHS</title><style>body{font-family:system-ui;background:#f3f7f5;margin:0;padding:16px}.w{max-width:820px;margin:auto}.c{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px #0001}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dde6e1;padding:8px;text-align:left}button{padding:9px 14px;background:#0b6b4a;color:#fff;border:0;border-radius:7px;cursor:pointer}img{border-radius:8px}@media print{.np{display:none}body{background:#fff}.c{box-shadow:none}}</style></head><body><div class="w"><div class="c np" style="display:flex;justify-content:space-between"><b>Mokhleshpur High School · Student Portal</b><span><button onclick="pm.style.display=pm.style.display==='none'?'block':'none'">Print Marksheet</button> <button onclick="sessionStorage.removeItem('mhs_student');location.href='login.html'">Logout</button></span></div><div class="c np" id="pm" style="display:none"><h3>Print Marksheet</h3><select id="pc"></select> <select id="py"></select> <select id="pt"><option>Half Yearly</option><option>Final Exam</option><option>Class Test</option><option>Lab Test</option></select> <button onclick="doPrint()">Print</button></div><div class="c" id="pf"></div><div class="c"><h3>My Running Class & Subjects</h3><div id="subjects"></div></div><div class="c"><h3>Results</h3><div id="rs"></div></div><div class="c np"><h3>Fee Payments</h3><div id="fe"></div></div></div><script src="../js/core.js"></script><script>const me=JSON.parse(sessionStorage.getItem('mhs_student')||'null');if(!me)location.href='login.html';const E=mhsEsc;pf.innerHTML=`<div style="display:flex;gap:16px;align-items:center">${me.photo?`<img src="${E(me.photo)}" width="80">`:''}<div><h2 style="margin:0">${E(me.name)}</h2>Student ID: ${E(me.studentId||'—')} · Adm: ${E(me.adm)} · Class ${E(me.class)}${me.section?'-'+E(me.section):''} · Roll ${E(me.roll)}<br>Guardian: ${E(me.guardian)}</div></div>`;const runningYear=Number(me.academicYear||new Date().getFullYear());mhsEnsureAcademicStructure(runningYear);const subIds=mhsStudentSubjects(me,runningYear),subNames=mhsSubjectNames(subIds);subjects.innerHTML=`<p><b>Academic Year:</b> ${E(runningYear)} · <b>Class:</b> ${E(me.class)}${me.section?'-'+E(me.section):''}</p>${subNames.length?`<ol>${subNames.map(x=>`<li>${E(x.name)} ${x.type==='Optional'?'<small>(Optional)</small>':''}</li>`).join('')}</ol>`:'No subjects have been assigned yet. Please contact the school office.'}`;
const R=mhsGet('mhs_results',[]).filter(r=>me.studentId?String(r.studentId||'')===String(me.studentId):String(r.name||'').trim().toLowerCase()===me.name.trim().toLowerCase());rs.innerHTML=R.map(r=>`<h4>Class ${E(r.class)} · ${E(r.year)} — ${E(r.exam||"")}</h4><table><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>${(r.subjects||[]).map(s=>`<tr><td>${E(s.subject)}</td><td>${E(s.marks)}</td><td>${E(s.grade)}</td></tr>`).join('')}</table><p><b>Total:</b> ${r.total} · <b>Avg:</b> ${Number(r.average).toFixed(2)} · <b>GPA:</b> ${Number(r.gpa).toFixed(2)}</p>`).join('')||'No result published yet.';const F=mhsGet('mhs_fees',[]).filter(f=>f.sid===me.id);fe.innerHTML=F.length?`<table><tr><th>Date</th><th>Purpose</th><th>Amount</th><th>Method</th></tr>${F.map(f=>`<tr><td>${E(f.date)}</td><td>${E(f.purpose)}</td><td>৳${E(f.amount)}</td><td>${E(f.method)} ${E(f.trx||'')}</td></tr>`).join('')}</table>`:'No payments recorded.';
const uq=a=>[...new Set(a)];pc.innerHTML=uq(R.map(r=>r.class)).map(c=>`<option value="${E(c)}">Class ${E(c)}</option>`).join('')||'<option value="">No result</option>';py.innerHTML=uq(R.map(r=>r.year)).map(c=>`<option>${E(c)}</option>`).join('');
function doPrint(){const r=R.find(r=>String(r.class)===pc.value&&String(r.year)===py.value&&String(r.exam||'')===pt.value);r?mhsPrintMarksheet(r,me):alert('No result published for the selected class, year and term.')}</script></body></html>
