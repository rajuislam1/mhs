<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal | Mokhleshpur High School</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#182b22;background:#f3f7f5}*{box-sizing:border-box}body{margin:0;padding:20px}.w{max-width:980px;margin:auto}.c{background:#fff;border:1px solid #e0e9e4;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #102b1b0c}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit}button{padding:10px 15px;background:#0b6b4a;color:#fff;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.6}select,input{padding:10px;border:1px solid #cbd8d1;border-radius:8px;width:100%;background:#fff}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}.form label{display:grid;gap:6px;font-size:13px;font-weight:650}.hint{color:#68776f}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border:1px solid #dce6e0;padding:9px;text-align:left}th{background:#edf4ef}.empty{padding:18px;text-align:center;color:#68776f;background:#f7faf8;border-radius:9px}#marksheetPrintArea{display:none}.error{color:#a12626}@media(max-width:680px){body{padding:10px}.form{grid-template-columns:1fr}.c{padding:14px}}@media print{body{padding:0;background:#fff}.np{display:none!important}body *{visibility:hidden}#marksheetPrintArea,#marksheetPrintArea *{visibility:visible}#marksheetPrintArea{display:block!important;position:absolute;left:0;top:0;width:100%;padding:22px}.print-sheet{border:3px double #174d39;padding:24px;max-width:850px;margin:auto;color:#111}.print-sheet h1,.print-sheet h2{text-align:center;margin:4px}.print-sheet h1{color:#174d39}.print-sheet table{margin:18px 0}.print-sheet .sign{display:flex;justify-content:space-between;margin-top:65px}.print-sheet .sign span{border-top:1px solid #222;padding:7px 25px 0}}
</style></head><body><div class="w">
<div class="c np toolbar"><b>Mokhleshpur High School · Student Portal</b><div class="actions"><button id="logout">Logout</button></div></div>
<div id="profile" class="c np">Loading student profile…</div>
<div class="c np"><h3>My Subjects</h3><div id="subjects">Loading…</div></div>
<div class="c np"><h3>Published Results</h3><p class="hint">Choose class and exam, search your published marksheet, then print.</p><div class="form"><label>Class<select id="msClass"></select></label><label>Exam<select id="msExam"><option value="">Select Exam</option><option>Test</option><option>Lab Test</option><option>Half Yearly</option><option>Final</option></select></label><label>Search<input id="msSearch" placeholder="Search exam or subject"></label></div><div class="actions" style="margin-top:14px"><button id="msFind">Search Marksheet</button><button id="msPrint" disabled>Print Marksheet</button></div><div id="msResults" class="empty" style="margin-top:14px">Select an exam and search.</div></div>
<div class="c np"><h3>Fee Payments</h3><div id="fees">Loading…</div></div><div id="error" class="c error np" hidden></div><div id="marksheetPrintArea"></div>
</div><script src="../js/supabase.js"></script><script>
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let sb,studentRecord,publishedRows=[],selectedMarksheet=null;
const fail=e=>{console.error(e);const box=document.getElementById('error');box.hidden=false;box.textContent=e.message||'Unable to load student data.';};
document.getElementById('logout').onclick=async()=>{try{await sb?.auth.signOut()}finally{location.href='login.html'}};
(async()=>{try{
 sb=await window.mhsSupabaseReady;const {data:sessionData,error:se}=await sb.auth.getSession();if(se)throw se;if(!sessionData.session){location.href='login.html';return;}
 const {data:p,error:pe}=await sb.from('user_profiles').select('id,role,is_active,student_id,display_name').eq('id',sessionData.session.user.id).maybeSingle();if(pe)throw pe;if(!p||p.role!=='student'||!p.is_active||!p.student_id){await sb.auth.signOut();location.href='login.html';return;}
 const {data:st,error:ste}=await sb.from('students').select('id,student_id,admission_number,name,father_name,mother_name,class_id,academic_year_id,roll,section,mobile,address,status,photo,classes(name,class_number),academic_years(year)').eq('id',p.student_id).maybeSingle();if(ste)throw ste;if(!st||!st.status){await sb.auth.signOut();location.href='login.html';return;}studentRecord=st;
 document.getElementById('profile').innerHTML='<h2>'+E(st.name)+'</h2><p><b>Student ID:</b> '+E(st.student_id)+' · <b>Admission No.:</b> '+E(st.admission_number||'—')+'</p><p><b>Class:</b> '+E(st.classes?.class_number||st.classes?.name||'—')+(st.section?' - '+E(st.section):'')+' · <b>Roll:</b> '+E(st.roll||'—')+' · <b>Academic Year:</b> '+E(st.academic_years?.year||'—')+'</p><p><b>Father:</b> '+E(st.father_name||'—')+' · <b>Mother:</b> '+E(st.mother_name||'—')+'</p>';
 const [{data:sub,error:sue},{data:res,error:re},{data:fees,error:fe}]=await Promise.all([
 sb.from('student_subjects').select('is_optional,class_subjects(subject_id,subjects(name),classes(class_number),academic_years(year))').eq('student_id',st.id),
 sb.from('results').select('id,exam_name,marks,grade,grade_point,status,academic_year_id,class_subjects(subjects(name))').eq('student_id',st.id).eq('status','published').eq('academic_year_id',st.academic_year_id).order('exam_name'),
 sb.from('student_fees').select('fee_type,amount,paid_amount,payment_status,due_date,paid_at,payment_method,transaction_id').eq('student_id',st.id).order('created_at',{ascending:false})
 ]);if(sue)throw sue;if(re)throw re;if(fe)throw fe;
 document.getElementById('subjects').innerHTML=(sub||[]).filter(x=>!x.class_subjects?.academic_years?.year||Number(x.class_subjects.academic_years.year)===Number(st.academic_years?.year)).map(x=>'<div>• '+E(x.class_subjects?.subjects?.name||'Subject')+(x.is_optional?' (Optional)':'')+'</div>').join('')||'<p class="hint">No subjects have been assigned yet.</p>';
 publishedRows=res||[];document.getElementById('msClass').innerHTML='<option value="'+st.class_id+'">Class '+E(st.classes?.class_number||st.classes?.name)+'</option>';
 document.getElementById('fees').innerHTML=(fees||[]).length?'<table><tr><th>Fee</th><th>Amount</th><th>Paid</th><th>Status</th><th>Due Date</th></tr>'+fees.map(x=>'<tr><td>'+E(x.fee_type)+'</td><td>৳'+E(x.amount)+'</td><td>৳'+E(x.paid_amount)+'</td><td>'+E(x.payment_status)+'</td><td>'+E(x.due_date||'—')+'</td></tr>').join('')+'</table>':'<p class="hint">No fee records are available.</p>';
}catch(e){fail(e)} })();
document.getElementById('msFind').onclick=()=>{const exam=msExam.value,term=msSearch.value.trim().toLowerCase();if(!exam){msResults.textContent='Please select an exam.';return;}const rows=publishedRows.filter(r=>r.exam_name.toLowerCase()===exam.toLowerCase()&&(!term||r.exam_name.toLowerCase().includes(term)||String(r.class_subjects?.subjects?.name||'').toLowerCase().includes(term)));if(!rows.length){selectedMarksheet=null;msPrint.disabled=true;msResults.textContent='No published marksheet found for this class and exam.';return;}selectedMarksheet=rows;const total=rows.reduce((n,r)=>n+Number(r.marks||0),0),gpa=rows.some(r=>Number(r.grade_point||0)===0)?0:Math.min(5,rows.reduce((n,r)=>n+Number(r.grade_point||0),0)/rows.length);msResults.innerHTML='<b>'+E(exam)+' · '+rows.length+' subjects</b><p>Total: '+total+' | Average: '+(total/rows.length).toFixed(2)+' | GPA: '+gpa.toFixed(2)+'</p><p>Marksheet is ready to print.</p>';msPrint.disabled=false;};
document.getElementById('msPrint').onclick=()=>{if(!selectedMarksheet?.length)return;const rows=selectedMarksheet,total=rows.reduce((n,r)=>n+Number(r.marks||0),0),gpa=rows.some(r=>Number(r.grade_point||0)===0)?0:Math.min(5,rows.reduce((n,r)=>n+Number(r.grade_point||0),0)/rows.length),pass=!rows.some(r=>String(r.grade||'').toUpperCase()==='F'||Number(r.grade_point||0)===0);marksheetPrintArea.innerHTML='<div class="print-sheet"><h1>Mokhleshpur High School</h1><p style="text-align:center">Mokhleshpur, Birol, Dinajpur · EIIN 120140</p><h2>ACADEMIC MARKSHEET</h2><p style="text-align:center">'+E(msExam.value)+' · '+E(studentRecord.academic_years?.year)+'</p><table><tr><td><b>Name:</b> '+E(studentRecord.name)+'</td><td><b>Student ID:</b> '+E(studentRecord.student_id)+'</td></tr><tr><td><b>Class:</b> '+E(studentRecord.classes?.class_number||'')+'</td><td><b>Roll:</b> '+E(studentRecord.roll||'—')+'</td></tr><tr><td><b>Admission No:</b> '+E(studentRecord.admission_number||'—')+'</td><td><b>Section:</b> '+E(studentRecord.section||'—')+'</td></tr></table><table><tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Grade Point</th></tr>'+rows.map(r=>'<tr><td>'+E(r.class_subjects?.subjects?.name||'Subject')+'</td><td>'+E(r.marks??'—')+'</td><td>'+E(r.grade||'—')+'</td><td>'+Number(r.grade_point||0).toFixed(2)+'</td></tr>').join('')+'</table><table><tr><th>Total</th><th>Average</th><th>GPA</th><th>Result</th></tr><tr><td>'+total+'</td><td>'+(total/rows.length).toFixed(2)+'</td><td>'+gpa.toFixed(2)+'</td><td>'+(pass?'PASSED':'FAILED')+'</td></tr></table><div class="sign"><span>Class Teacher</span><span>Headmaster</span></div></div>';window.print();};
</script></body></html>
