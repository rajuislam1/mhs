<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Student Portal | MHS</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f3f7f5;margin:0;padding:16px;color:#1c2c24}.w{max-width:960px;margin:auto}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px #0001;overflow:auto}.head{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{color:#0b6b4a;font-weight:700}button{padding:9px 14px;background:#0b6b4a;color:#fff;border:0;border-radius:7px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #dde6e1;padding:9px;text-align:left}th{background:#f3f7f5}.muted{color:#607167}.error{color:#a32020}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.stat{background:#f3f7f5;padding:12px;border-radius:8px}@media print{.np{display:none}body{background:#fff}.card{box-shadow:none}}
</style></head><body><main class="w">
<div class="card head np"><div><div class="brand">Mokhleshpur High School · Student Portal</div><div class="muted" id="welcome">Checking your secure session…</div></div><div><button id="print">Print Marksheet</button> <button id="logout">Logout</button></div></div>
<div class="card" id="profile">Loading your student profile…</div>
<div class="card"><h2>My Running Class & Subjects</h2><div id="subjects" class="muted">Loading subjects…</div></div>
<div class="card"><h2>Published Results</h2><div id="results" class="muted">Loading results…</div></div>
<div class="card np"><h2>Fee Payments</h2><div id="fees" class="muted">Loading fee records…</div></div>
<div id="msg" class="card error" hidden></div></main>
<script src="../js/supabase.js"></script><script src="../js/auth-guard.js"></script>
<script>
(function(){
 const $=id=>document.getElementById(id);let resultRows=[];
 const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const err=m=>{$('msg').hidden=false;$('msg').textContent=m;};
 $('logout').addEventListener('click',async()=>{const b=$('logout');b.disabled=true;try{const sb=await window.mhsSupabaseReady;const {error}=await sb.auth.signOut();if(error)throw error;location.replace('login.html')}catch(e){err('Logout failed. Please try again.');b.disabled=false;}});
 $('print').addEventListener('click',()=>window.print());
 async function load(){
  try{
   const sb=await window.mhsSupabaseReady;
   const {data:{session},error:se}=await sb.auth.getSession();if(se||!session){location.replace('login.html');return;}
   const {data:p,error:pe}=await sb.from('user_profiles').select('id,role,is_active,student_id,display_name').eq('id',session.user.id).maybeSingle();
   if(pe||!p||p.role!=='student'||p.is_active!==true||!p.student_id){await sb.auth.signOut();location.replace('login.html');return;}
   const {data:s,error:ste}=await sb.from('students').select('id,student_id,name,father_name,mother_name,roll,section,guardian,photo,class_id,academic_year_id,admission_number,status').eq('id',p.student_id).maybeSingle();
   if(ste)throw ste;if(!s)throw new Error('Student record not found. Please contact the school office.');
   const [{data:cl},{data:yr},{data:subs,error:sue},{data:results,error:re},{data:fees,error:fe}] = await Promise.all([
    sb.from('classes').select('id,name,class_number').eq('id',s.class_id).maybeSingle(),
    sb.from('academic_years').select('id,year,name').eq('id',s.academic_year_id).maybeSingle(),
    sb.from('student_subjects').select('id,is_optional,class_subjects(id,subject_id,is_compulsory,subjects(name,code))').eq('student_id',s.id),
    sb.from('results').select('id,exam_name,marks,grade,grade_point,status,published_at,academic_year_id,class_subject_id,class_subjects(subject_id,subjects(name)),academic_years(year,name)').eq('student_id',s.id).eq('status','published').order('published_at',{ascending:false}),
    sb.from('student_fees').select('id,fee_type,amount,paid_amount,payment_status,paid_at,payment_method,transaction_id,due_date,remarks').eq('student_id',s.id).order('created_at',{ascending:false})
   ]);
   if(sue)throw sue;if(re)throw re;if(fe)throw fe;resultRows=results||[];
   $('welcome').textContent='Signed in as '+(p.display_name||s.name||session.user.email);
   $('profile').innerHTML='<div class="grid"><div><span class="muted">Student name</span><h2>'+esc(s.name)+'</h2></div><div><span class="muted">Student ID</span><p>'+esc(s.student_id)+'</p></div><div><span class="muted">Admission No.</span><p>'+esc(s.admission_number)+'</p></div><div><span class="muted">Class / Roll</span><p>'+esc(cl?.name||cl?.class_number)+' / '+esc(s.roll)+'</p></div><div><span class="muted">Academic year</span><p>'+esc(yr?.year||yr?.name)+'</p></div><div><span class="muted">Guardian</span><p>'+esc(s.guardian||s.father_name)+'</p></div></div>';
   const subjectRows=(subs||[]).map(x=>{const cs=x.class_subjects||{},su=cs.subjects||{};return '<tr><td>'+esc(su.name)+'</td><td>'+((x.is_optional||cs.is_compulsory===false)?'Optional':'Compulsory')+'</td></tr>'}).join('');
   $('subjects').innerHTML=subjectRows?'<table><thead><tr><th>Subject</th><th>Type</th></tr></thead><tbody>'+subjectRows+'</tbody></table>':'No subjects have been assigned for this student.';
   $('results').innerHTML=resultRows.length?'<table><thead><tr><th>Academic year</th><th>Exam</th><th>Subject</th><th>Marks</th><th>Grade</th><th>Grade point</th></tr></thead><tbody>'+resultRows.map(r=>'<tr><td>'+esc(r.academic_years?.year||r.academic_years?.name)+'</td><td>'+esc(r.exam_name)+'</td><td>'+esc(r.class_subjects?.subjects?.name)+'</td><td>'+esc(r.marks)+'</td><td>'+esc(r.grade)+'</td><td>'+esc(r.grade_point)+'</td></tr>').join('')+'</tbody></table>':'No published results yet.';
   $('fees').innerHTML=(fees||[]).length?'<table><thead><tr><th>Fee type</th><th>Amount</th><th>Paid</th><th>Status</th><th>Paid at</th><th>Method</th></tr></thead><tbody>'+fees.map(f=>'<tr><td>'+esc(f.fee_type)+'</td><td>৳'+esc(f.amount)+'</td><td>৳'+esc(f.paid_amount)+'</td><td>'+esc(f.payment_status)+'</td><td>'+esc(f.paid_at?new Date(f.paid_at).toLocaleDateString():'—')+'</td><td>'+esc(f.payment_method)+'</td></tr>').join('')+'</tbody></table>':'No fee records available.';
  }catch(e){console.error(e);err('Could not load portal data securely: '+(e.message||'Please try again later.'));}}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();
})();
</script></body></html>
