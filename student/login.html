<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login | Mokhleshpur High School</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f3f7f5;display:grid;place-items:center;min-height:100vh;margin:0;padding:18px}.card{background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 30px #0001;width:min(390px,100%);display:grid;gap:14px}.brand{text-align:center;color:#0b6b4a}.brand img{width:70px;height:70px}.brand h1{font-size:22px;margin:6px 0}.brand p{margin:0;color:#66756d}label{display:grid;gap:6px;font-size:14px;font-weight:600}input,button{padding:12px;font:inherit;border-radius:8px;border:1px solid #ccd8d3;width:100%}button{background:#0b6b4a;color:#fff;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.6}#msg{font-size:14px;color:#b00020;overflow-wrap:anywhere}.back{text-align:center;color:#0b6b4a}
</style>
</head><body><main class="card">
<div class="brand"><img src="../assets/images/logo.svg" alt="School logo"><h1>Student Portal</h1><p>মোখলেশপুর উচ্চ বিদ্যালয়</p></div>
<form id="login" style="display:grid;gap:13px">
<label>Roll Number<input id="roll" type="text" inputmode="numeric" autocomplete="username" required placeholder="Enter your roll number"></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button id="submit" type="submit">Sign In</button><div id="msg" role="alert"></div>
</form><a class="back" href="../student.html">← Back to Student Portal</a>
</main>
<script src="../js/supabase.js"></script>
<script>
document.getElementById('login').addEventListener('submit',async function(e){
 e.preventDefault();const btn=document.getElementById('submit'),msg=document.getElementById('msg');
 btn.disabled=true;msg.textContent='Verifying account…';
 try{
  const sb=await window.mhsSupabaseReady;
  const response=await fetch('../api/student-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roll:document.getElementById('roll').value.trim(),password:document.getElementById('password').value})});
  const result=await response.json().catch(()=>null);
  if(!response.ok||!result?.success||!result?.session)throw new Error(result?.error||'Invalid roll number or password.');
  const {error:sessionError}=await sb.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});
  if(sessionError)throw sessionError;
  const {data:{user},error:userError}=await sb.auth.getUser();
  if(userError||!user)throw new Error('Could not verify student session.');
  const {data:profile,error:pe}=await sb.from('user_profiles').select('id,role,is_active,student_id').eq('id',user.id).maybeSingle();
  if(pe)throw new Error('Could not verify student profile.');
  if(!profile||profile.role!=='student'||profile.is_active!==true||!profile.student_id){await sb.auth.signOut();throw new Error('This account does not have active student access. Please contact the school office.');}
  location.replace('index.html');
 }catch(err){console.error('Student login failed:',err);msg.textContent=err.message||'Sign in failed. Check your email and password.';}
 finally{btn.disabled=false;}
});
</script></body></html>
