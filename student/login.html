<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | MHS</title><style>body{font-family:system-ui;background:#f3f7f5;display:grid;place-items:center;min-height:100vh;margin:0}form{background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001;width:min(340px,90vw);display:grid;gap:12px}input,button{padding:11px;font:inherit;border-radius:7px;border:1px solid #ccd8d3}button{background:#0b6b4a;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.6}#msg{color:#b00020;font-size:14px}</style></head><body><form id="login"><h2>Student Login</h2><label>Student ID / Admission No.<input id="u" required autocomplete="username"></label><label>Password<input id="p" type="password" required autocomplete="current-password"></label><button id="submit" type="submit">Login</button><div id="msg" role="status" aria-live="polite"></div><a href="../student.html">← Student Portal</a></form><script src="../js/supabase.js"></script><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),msg=document.getElementById('msg');button.disabled=true;msg.textContent='Signing in…';try{const response=await fetch('../api/student-login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({login:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});const payload=await response.json();if(!response.ok||!payload.success)throw new Error(payload.error||'Login failed.');const sb=await window.mhsSupabaseReady;const {error}=await sb.auth.setSession({access_token:payload.session.access_token,refresh_token:payload.session.refresh_token});if(error)throw error;location.href='index.html';}catch(error){console.error('Student sign-in failed:',error);msg.textContent=error.message||'Unable to sign in.';}finally{button.disabled=false;}});</script></body></html>
