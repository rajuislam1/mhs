<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | MHS</title><style>body{font-family:system-ui;background:#f3f7f5;display:grid;place-items:center;min-height:100vh;margin:0}form{background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001;width:min(340px,90vw);display:grid;gap:12px}input,button{padding:11px;font:inherit;border-radius:7px;border:1px solid #ccd8d3}button{background:#0b6b4a;color:#fff;border:0;cursor:pointer}#msg{color:#b00020;font-size:14px}</style></head><body><form id="login"><h2>Student Login</h2><input id="u" placeholder="Student ID or Admission No." required><input id="p" type="password" placeholder="Password" required><button>Login</button><div id="msg"></div><a href="../student.html">← Student Portal</a></form><script src="../js/core.js"></script><script>login.onsubmit=async e=>{e.preventDefault();const h=await mhsHash(p.value),s=mhsGet('mhs_students',[]).find(x=>(x.studentId===u.value.trim()||x.adm===u.value.trim())&&x.pass===h);if(s){const{pass,...safe}=s;sessionStorage.setItem('mhs_student',JSON.stringify(safe));location.href='index.html'}else msg.textContent='Invalid Student ID/Admission No. or password.'}</script></body></html>
