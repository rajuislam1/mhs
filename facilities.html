<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Information | MHS</title><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span>MOKHLESHPUR HIGH SCHOOL</span><h1 id="pageHeading">School Information</h1><p id="pageIntro">Explore school information and activities.</p></div><section class="section"><div id="mhsDetailContent" class="mhs-detail-grid"><p>Loading published content…</p></div></section></main><script src="js/supabase.js"></script><script>
(async()=>{const cfg={facilities:['facility','Our Facilities','বিদ্যালয়ের সুযোগ-সুবিধা'],events:['event','Events & Activities','বিদ্যালয়ের অনুষ্ঠান ও কার্যক্রম'],achievements:['achievement','Achievements','শিক্ষার্থীদের অর্জন ও সাফল্য'],library:['library','Library & Reading Corner','গ্রন্থাগার ও পাঠাগার']};const key=location.pathname.split('/').pop().replace('.html',''),[type,title,bn]=cfg[key]||cfg.facilities;document.title=title+' | Mokhleshpur High School';document.getElementById('pageHeading').textContent=title;document.getElementById('pageIntro').textContent=bn;const el=document.getElementById('mhsDetailContent'),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));try{const sb=await window.mhsSupabaseReady,{data,error}=await sb.from('school_public_content').select('*').eq('content_type',type).eq('is_published',true).order('display_order').order('event_date');if(error)throw error;el.innerHTML=(data||[]).map(x=>'<article class="mhs-detail-card">'+(x.image_url?'<img loading="lazy" src="'+E(x.image_url)+'" alt="'+E(x.title)+'">':'')+'<div><h2>'+E(x.title)+'</h2>'+(x.title_bn?'<h3>'+E(x.title_bn)+'</h3>':'')+'<p>'+E(x.description||'')+'</p>'+(x.event_date?'<p><b>Date:</b> '+E(new Date(x.event_date+'T00:00:00').toLocaleDateString())+(x.end_date?' – '+E(new Date(x.end_date+'T00:00:00').toLocaleDateString()):'')+'</p>':'')+(x.location?'<p><b>Location:</b> '+E(x.location)+'</p>':'')+(x.author?'<p><b>Author:</b> '+E(x.author)+'</p>':'')+(x.book_category?'<p><b>Category:</b> '+E(x.book_category)+'</p>':'')+(x.total_copies!==null&&x.total_copies!==undefined?'<p><b>Copies:</b> '+E(x.available_copies??'—')+' available / '+E(x.total_copies)+' total</p>':'')+'</div></article>').join('')||'<div class="empty">No content has been published yet. Please check back later.</div>';}catch(e){console.error(e);el.innerHTML='<p class="hint">Content is temporarily unavailable.</p>';}})();
</script><script src="js/core.js"></script><script src="js/footer.js"></script></body></html>
