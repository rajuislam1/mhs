<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Calendar | MHS</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="assets/images/logo.svg"></head><body><script src="js/header.js"></script><main class="page"><div class="page-hero"><span data-en="SCHOOL YEAR AT A GLANCE" data-bn="এক নজরে বিদ্যালয়ের শিক্ষাবর্ষ">SCHOOL YEAR AT A GLANCE</span><h1 data-en="Academic Calendar & Events" data-bn="বার্ষিক শিক্ষাপঞ্জি ও অনুষ্ঠান">Academic Calendar & Events</h1><p data-en="Examinations, holidays, meetings and school activities." data-bn="পরীক্ষা, ছুটি, সভা ও বিদ্যালয়ের কার্যক্রম।">Examinations, holidays, meetings and school activities.</p></div><section class="section"><div class="calendar-note" data-en="Official dates are published and updated through the school Notice Board. Please check notices before planning." data-bn="অফিসিয়াল তারিখ বিদ্যালয়ের নোটিশ বোর্ডে প্রকাশ ও হালনাগাদ করা হয়। পরিকল্পনার আগে নোটিশ দেখে নিন।">Official dates are published and updated through the school Notice Board. Please check notices before planning.</div><div id="calendarEvents" class="event-list"><p>Loading events…</p></div><a class="btn green" href="notices.html" data-en="View all notices →" data-bn="সব নোটিশ দেখুন →">View all notices →</a></section></main><script src="js/supabase.js"></script><script> (async()=>{const el=document.getElementById('calendarEvents');const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));try{const sb=await window.mhsSupabaseReady;const [{data:notices,error:ne},{data:calendar,error:ce}]=await Promise.all([sb.from('notices').select('title,content,notice_type,published_at,created_at').eq('is_published',true).order('published_at',{ascending:true}),sb.from('school_public_content').select('title,description,event_date,end_date,location').eq('content_type','calendar').eq('is_published',true).order('event_date')]);if(ne)throw ne;if(ce)throw ce;const noticeRows=(notices||[]).filter(x=>/exam|holiday|event|sports|cultural|meeting|পরীক্ষা|ছুটি|অনুষ্ঠান|ক্রীড়া|সভা/i.test((x.notice_type||'')+' '+(x.title||''))).map(x=>({title:x.title,content:x.content,date:x.published_at||x.created_at}));const calendarRows=(calendar||[]).map(x=>({title:x.title,content:[x.description,x.location?'Location: '+x.location:''].filter(Boolean).join(' · '),date:x.event_date}));const rows=[...noticeRows,...calendarRows].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));el.innerHTML=rows.map(x=>'<article class="event-row"><time>'+E(x.date?new Date(x.date+'T00:00:00').toLocaleDateString():'')+'</time><div><h3>'+E(x.title)+'</h3><p>'+E(x.content||'')+'</p></div></article>').join('')||'<p class="empty">No upcoming events have been published yet. Please check the Notice Board.</p>';window.MHS_I18N?.translate(el)}catch(e){console.error(e);el.innerHTML='<p class="empty">Calendar information is temporarily unavailable.</p>'}})();</script><script src="js/footer.js"></script></body></html>
